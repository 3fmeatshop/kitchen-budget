:root{
  color-scheme: light;
  --brand:#2563eb; --brand-ink:#ffffff; --brand-soft:#eaf1fe; --brand-deep:#1e40af;
  --gold:#2563eb; --gold-soft:#eaf1fe; --gold-ink:#1d4ed8;
  --page:#f4f6f9; --surface:#ffffff; --surface-2:#eef1f5;
  --ink:#111827; --ink-2:#4b5563; --muted:#6b7280;
  --line:#e5e7eb; --axis:#d1d5db; --ring:rgba(17,24,39,.06);
  --series-1:#2563eb; --series-2:#eb6834; --pace:#898781;
  --good:#16a34a; --good-ink:#15803d; --warn:#f59e0b; --warn-ink:#92400e; --crit:#dc2626; --crit-ink:#b91c1c;
  --good-bg:#e8f6ec; --warn-bg:#fef3dc; --crit-bg:#fdecec;
  --radius:14px; --shadow:0 1px 2px rgba(17,24,39,.05);
}


*{box-sizing:border-box}
html [hidden]{display:none !important}
html,body{margin:0;background:var(--page);color:var(--ink);font:15px/1.5 "InterApp",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit;font-family:"InterApp",system-ui,sans-serif}
.num,td.r,th.r{font-variant-numeric:tabular-nums}
header.top{position:sticky;top:0;z-index:20;background:var(--brand);color:var(--brand-ink);padding:10px 16px calc(10px) 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header.top h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.2px;flex:1;min-width:150px}
header.top .sub{font-size:12px;opacity:.85;font-weight:500;display:block}
nav.tabs{position:sticky;top:0;z-index:15;background:var(--surface);border-bottom:1px solid var(--line);display:flex;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:1 0 auto;border:0;background:none;padding:12px 14px;font-weight:600;color:var(--ink-2);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand)}
main{max-width:1100px;margin:0 auto;padding:16px 16px 96px}
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--ring);padding:16px;margin-bottom:16px}
.card h2{font-size:15px;margin:0 0 4px;font-weight:700}
.card .hint{color:var(--ink-2);font-size:13px;margin:0 0 12px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--ring);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow)}
.tile .k{font-size:12px;color:var(--ink-2);font-weight:600}
.tile .v{font-size:22px;font-weight:700;margin-top:2px}
.tile .s{font-size:12px;color:var(--muted);margin-top:2px}
.hero{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
.hero .big{font-size:34px;font-weight:800;line-height:1.1}
.hero .of{color:var(--ink-2);font-size:14px}
.badge{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 12px;font-weight:700;font-size:13px}
.badge.good{background:var(--good-bg);color:var(--good-ink)}
.badge.warn{background:var(--warn-bg);color:var(--warn-ink)}
.badge.crit{background:var(--crit-bg);color:var(--crit-ink)}
.badge svg{width:16px;height:16px}
.meter{position:relative;height:14px;background:var(--surface-2);border-radius:999px;margin:14px 0 6px;overflow:visible}
.meter .fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px}
.meter .pace{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink)}
.meter-legend{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-2);gap:8px;flex-wrap:wrap}
.alert{display:flex;gap:10px;align-items:flex-start;border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:14px}
.alert svg{flex:0 0 18px;width:18px;height:18px;margin-top:1px}
.alert.crit{background:var(--crit-bg);color:var(--crit-ink)}
.alert.warn{background:var(--warn-bg);color:var(--warn-ink)}
.alert.good{background:var(--good-bg);color:var(--good-ink)}
.alert b{color:inherit}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin-bottom:16px}
.filters label{display:flex;flex-direction:column;font-size:12px;font-weight:600;color:var(--ink-2);gap:4px;flex:1 1 140px;min-width:0}
input,select,textarea{background:var(--surface);border:1px solid var(--axis);border-radius:8px;padding:9px 10px;min-height:40px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:0;border-color:var(--brand)}
.btn{border:1px solid var(--axis);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer;min-height:40px;white-space:nowrap}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.danger{color:var(--crit-ink);border-color:var(--crit)}
.btn.sm{padding:5px 10px;min-height:32px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12px;color:var(--ink-2);text-align:left;font-weight:600;border-bottom:1px solid var(--axis);padding:8px 6px}
td{border-bottom:1px solid var(--line);padding:8px 6px;vertical-align:top}
td.r,th.r{text-align:right;white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
.tbl-wrap{overflow-x:auto;margin:0 -4px}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;background:var(--surface-2);color:var(--ink-2);margin-left:4px;vertical-align:1px}
.tag.mine{background:var(--brand-soft);color:var(--brand)}
.muted{color:var(--muted)}
.small{font-size:12px}
.empty{text-align:center;padding:28px 12px;color:var(--ink-2)}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:30;background:var(--brand);color:var(--brand-ink);border:0;border-radius:999px;padding:14px 20px;font-weight:700;font-size:15px;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer;display:flex;align-items:center;gap:8px}
.fab svg{width:20px;height:20px}
dialog{border:0;border-radius:16px;padding:0;width:min(560px,calc(100vw - 24px));background:var(--surface);color:var(--ink);box-shadow:0 10px 40px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog form{padding:18px}
dialog h3{margin:0 0 12px;font-size:17px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fgrid label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--ink-2)}
.fgrid .full{grid-column:1/-1}
.check{display:flex !important;flex-direction:row !important;align-items:center;gap:8px;font-size:14px !important;font-weight:500 !important;color:var(--ink) !important}
.check input{width:18px;height:18px;min-height:0}
.total-line{font-size:20px;font-weight:800;text-align:right;margin:12px 0 4px}
.dlg-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--muted);font-size:11px;font-family:inherit}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin:4px 0 8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:14px;height:3px;border-radius:2px}
.sw.box{height:10px;width:10px;border-radius:3px}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12px;padding:6px 9px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-100%);margin-top:-10px;opacity:0;transition:opacity .1s;z-index:5}
.tip b{display:block}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-weight:600;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100vw - 32px)}
.toast.show{opacity:1}
.bar-cell{position:relative;min-width:80px}
.bar-cell .b{height:8px;border-radius:4px;background:var(--series-1);margin-top:6px}
.section-title{font-size:13px;font-weight:700;color:var(--ink-2);text-transform:uppercase;letter-spacing:.5px;margin:22px 0 10px}
.list-item{display:flex;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line)}
.list-item .main{flex:1;min-width:0}
.list-item .name{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.list-item .meta{font-size:12px;color:var(--ink-2)}
.list-item .amt{font-weight:700;text-align:right;white-space:nowrap}
.date-head{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--ink-2);padding:14px 4px 4px;border-bottom:1px solid var(--axis)}
.icon-btn{border:0;background:none;padding:6px;border-radius:8px;cursor:pointer;color:var(--ink-2)}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg{width:18px;height:18px;display:block}
.warnbar{background:var(--warn-bg);color:var(--warn-ink);padding:8px 16px;font-size:13px;font-weight:600;display:none}

/* ---- app-style navigation ---- */
nav.tabs button{display:flex;align-items:center;justify-content:center;gap:8px}
nav.tabs button svg{width:20px;height:20px;flex:0 0 20px}
@media (max-width:760px){
  nav.tabs{position:fixed;top:auto;bottom:0;left:0;right:0;z-index:40;border-top:1px solid var(--line);border-bottom:0;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -2px 10px rgba(0,0,0,.06);overflow:visible}
  nav.tabs button{flex:1 1 0;flex-direction:column;gap:2px;padding:8px 2px 7px;font-size:10.5px;font-weight:600;border-bottom:0;border-top:3px solid transparent;min-width:0}
  nav.tabs button[aria-selected="true"]{border-top-color:var(--brand);background:var(--brand-soft)}
  nav.tabs button svg{width:22px;height:22px}
  main{padding-bottom:150px}
  .fab{bottom:calc(76px + env(safe-area-inset-bottom));padding:12px 16px}
  .toast{bottom:150px}
  header.top{padding:10px 14px}
}
/* ---- segmented control & day chips ---- */
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px;margin:0 0 14px;position:sticky;top:0;z-index:12}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:10px 6px;font-weight:700;color:var(--ink-2);cursor:pointer;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--brand);box-shadow:var(--shadow)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px 6px;scrollbar-width:thin}
.chip{flex:0 0 auto;border:1px solid var(--axis);background:var(--surface);border-radius:12px;padding:6px 10px;text-align:center;cursor:pointer;min-width:62px;line-height:1.2}
.chip b{display:block;font-size:13px}
.chip span{font-size:11px;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.chip[aria-pressed="true"] span{color:#fff}
.chip.ok{border-color:var(--good)}
.chip .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--good);margin-left:3px;vertical-align:2px}
.meal-block{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px}
.meal-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.meal-pill{font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;border-radius:999px;padding:3px 9px;background:var(--brand-soft);color:var(--brand)}
.meal-dish{font-size:16px;font-weight:700}
.ing{width:100%;border-collapse:collapse;font-size:14px;margin-top:4px}
.ing td{padding:5px 2px;border-bottom:1px dashed var(--line)}
.ing td.q{text-align:right;font-weight:700;white-space:nowrap}
.ing td.pp{text-align:right;color:var(--ink-2);font-size:12px;white-space:nowrap;width:70px}
.bigbtn{white-space:normal;text-align:center;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;border-radius:12px;font-size:15px}
.bigbtn svg{width:20px;height:20px}
.daynav{display:flex;gap:8px;margin-top:12px}
.daynav .btn{flex:1}
.glance .list-item{cursor:pointer}
.glance .list-item:hover{background:var(--surface-2)}
/* ---- chef card dialog ---- */
#dlgChef{width:min(640px,calc(100vw - 16px));max-height:calc(100vh - 24px)}
#dlgChef .wrap{padding:14px;overflow:auto;max-height:calc(100vh - 140px)}
#dlgChef img{width:100%;border-radius:10px;border:1px solid var(--line);display:block}
#dlgChef .bar{display:flex;gap:8px;flex-wrap:wrap;padding:12px 14px;border-top:1px solid var(--line)}
#dlgChef .bar .btn{flex:1 1 140px}

/* ---- clean, simple theme ---- */
header.top{background:var(--brand);color:#fff;padding:14px 16px}
header.top h1{font-size:19px;font-weight:700}
header.top .sub{color:rgba(255,255,255,.85);opacity:1}
.card{border:1px solid var(--line);box-shadow:var(--shadow)}
.card h2{font-size:17px;font-weight:700}
.tile{border:1px solid var(--line);box-shadow:none}
.tile .k{font-size:12px;color:var(--ink-2);text-transform:none;letter-spacing:0}
.tile .v{font-size:22px;font-weight:700}
.section-title{font-size:15px;color:var(--ink);text-transform:none;letter-spacing:0;font-weight:700}
.btn{border-radius:10px;min-height:44px;font-weight:600;white-space:normal;text-align:center;line-height:1.25}
.btn.sm{min-height:36px;border-radius:9px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:active{filter:brightness(.92)}
.fab{background:var(--brand);color:#fff;border:0}
input,select,textarea{min-height:44px;border-radius:10px;font-size:16px}
nav.tabs button[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand)}
.seg{background:var(--surface-2);border:0}
.seg button{min-height:44px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--brand);box-shadow:0 1px 3px rgba(17,24,39,.12)}
.chip{border-color:var(--line);min-width:70px;padding:8px 10px}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.meal-pill{background:var(--brand-soft);color:var(--brand-deep);border:0}
.meal-block{background:var(--surface)}
.meal-dish{font-size:17px;font-weight:700}
.tag.mine{background:var(--brand-soft);color:var(--brand-deep)}
.bar-cell .b{background:var(--brand)}
.list-item{min-height:52px}
@media (max-width:760px){
  nav.tabs{background:var(--surface);border-top:1px solid var(--line)}
  nav.tabs button{color:var(--muted);font-size:11px}
  nav.tabs button[aria-selected="true"]{color:var(--brand);border-top-color:transparent;background:transparent}
  nav.tabs button[aria-selected="true"] svg{background:var(--brand-soft);border-radius:999px;padding:3px 14px;width:52px;height:28px;box-sizing:border-box}
  .card{padding:14px;border-radius:14px}
  .tiles{grid-template-columns:1fr 1fr;gap:10px}
}


/* ---- friendlier phone layout ---- */
html,body{font-size:16px}
.home-hero{text-align:left}
.mini-select{width:auto;max-width:100%;min-height:36px;font-size:13px;padding:4px 10px;border-radius:999px;background:var(--surface-2);border:0;color:var(--ink-2);margin-bottom:10px}
.hl{font-size:14px;color:var(--ink-2);font-weight:600}
.hbig{font-size:40px;font-weight:800;line-height:1.1;margin:2px 0}
.hsub{color:var(--ink-2);font-size:14px}
.meal-pill{display:inline-block;min-width:86px;text-align:center}
.safe{margin-top:12px;background:var(--brand-soft);color:var(--brand-deep);border-radius:12px;padding:10px 12px;font-size:14px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.qa{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 4px;font-weight:600;font-size:12.5px;color:var(--ink);cursor:pointer;min-height:84px}
.qa svg{width:26px;height:26px;color:var(--brand);background:var(--brand-soft);border-radius:12px;padding:6px;box-sizing:content-box}
.qa:active{transform:scale(.97)}
details.more > summary{cursor:pointer;list-style:none;padding:2px 0}
details.more > summary::-webkit-details-marker{display:none}
details.more > summary::after{content:"Show ›";float:right;color:var(--brand);font-weight:700;font-size:14px}
details.more[open] > summary::after{content:"Hide";}
details.dayedit > summary{cursor:pointer;color:var(--brand);font-weight:700;font-size:14px;padding:8px 0;list-style:none}
details.dayedit > summary::-webkit-details-marker{display:none}
.hint{font-size:13px}
@media (max-width:420px){ .quick{gap:8px} .qa{font-size:11.5px;min-height:78px} .hbig{font-size:36px} }

/* ---- welcome screen ---- */
.welcome{text-align:center;padding:28px 18px}
.welcome .wicon{width:72px;height:72px;border-radius:20px;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.welcome .wicon svg{width:40px;height:40px}
.welcome h2{font-size:22px !important;margin-bottom:6px !important}
.welcome p{color:var(--ink-2);margin:0 0 18px;font-size:15px}
.welcome .btn{width:100%;margin-top:10px;min-height:52px;font-size:16px}
.steps3{display:grid;gap:10px;margin-top:4px}
.steps3 div{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--ink-2)}
.steps3 b.n{flex:0 0 28px;height:28px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px}
.steps3 b.t{display:block;color:var(--ink);font-size:15px}

/* ---- colour & type enhancement ---- */
:root{
  --ink:#0f172a; --ink-2:#475569; --muted:#64748b; --page:#f3f5fb; --line:#e3e8f0;
  --brand:#2563eb; --brand-2:#4f46e5; --brand-soft:#e9efff; --brand-deep:#1e3a8a;
  --mB:#d97706; --mB-bg:#fff4e0; --mB-ink:#92400e;
  --mL:#16a34a; --mL-bg:#e6f6ec; --mL-ink:#166534;
  --mD:#6366f1; --mD-bg:#eef0ff; --mD-ink:#3730a3;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 4px 14px rgba(15,23,42,.05);
}
body{font-feature-settings:"cv11","ss01";letter-spacing:-.005em;-webkit-font-smoothing:antialiased}
.num,.hbig,.tile .v,.amt,td.q{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
h2,.card h2{letter-spacing:-.015em;color:var(--ink)}
header.top{background:linear-gradient(120deg,#2563eb 0%,#4f46e5 100%)}
header.top h1{font-weight:800;letter-spacing:-.02em}
.card{box-shadow:var(--shadow);border-color:#e6ebf3}
.btn.primary{background:linear-gradient(120deg,#2563eb,#4f46e5);border:0;box-shadow:0 4px 12px rgba(37,99,235,.25)}
.home-hero{background:linear-gradient(135deg,#2563eb 0%,#4f46e5 100%);color:#fff;border:0;box-shadow:0 10px 24px rgba(79,70,229,.25)}
.home-hero .hl,.home-hero .hsub,.home-hero .small,.home-hero .muted{color:rgba(255,255,255,.85) !important}
.home-hero .hbig{color:#fff !important;font-size:42px;font-weight:800;letter-spacing:-.03em}
.home-hero .hsub b{color:#fff}
.home-hero .meter{background:rgba(255,255,255,.25)}
.home-hero .meter .pace{background:#fff}
.home-hero .mini-select{background:rgba(255,255,255,.18);color:#fff}
.home-hero .mini-select option{color:#0f172a}
.home-hero .safe{background:rgba(255,255,255,.16);color:#fff}
.home-hero .badge{background:#fff}
.quick .qa{box-shadow:var(--shadow);border-color:#e6ebf3}
.quick .qa:nth-child(1) svg{color:#2563eb;background:#e9efff}
.quick .qa:nth-child(2) svg{color:#16a34a;background:#e6f6ec}
.quick .qa:nth-child(3) svg{color:#d97706;background:#fff4e0}
.quick .qa:nth-child(4) svg{color:#7c3aed;background:#f1eaff}
.meal-pill.m-B{background:var(--mB-bg);color:var(--mB-ink)}
.meal-pill.m-L{background:var(--mL-bg);color:var(--mL-ink)}
.meal-pill.m-D{background:var(--mD-bg);color:var(--mD-ink)}
.meal-block.m-B{border-left:4px solid var(--mB)}
.meal-block.m-L{border-left:4px solid var(--mL)}
.meal-block.m-D{border-left:4px solid var(--mD)}
.meal-dish{color:var(--ink);letter-spacing:-.01em}
.chip[aria-pressed="true"]{background:linear-gradient(120deg,#2563eb,#4f46e5);border:0;box-shadow:0 4px 10px rgba(37,99,235,.25)}
.seg button[aria-pressed="true"]{color:var(--brand);font-weight:800}
.tile{border-top:3px solid var(--brand)}
.tiles .tile:nth-child(2){border-top-color:#16a34a}
.tiles .tile:nth-child(3){border-top-color:#d97706}
.tiles .tile:nth-child(4){border-top-color:#7c3aed}
.welcome .wicon{background:linear-gradient(135deg,#e9efff,#efeaff)}
.steps3 b.n{background:linear-gradient(120deg,#2563eb,#4f46e5)}
.hint,.meta,.small.muted{color:var(--muted)}
nav.tabs button[aria-selected="true"]{font-weight:700}

@media (max-width:520px){
  .fgrid{grid-template-columns:1fr}
  .hero .big{font-size:28px}
  .tile .v{font-size:19px}
  .hide-sm{display:none}
}
@media print{
  header.top,nav.tabs,.fab,.filters .btn,.no-print{display:none !important}
  body{background:#fff}
  .card{box-shadow:none;border:1px solid #ccc;break-inside:avoid}
}

<body>
<header class="top">
  <h1>Home Kitchen Budget<span class="sub" id="hdrSub">Offline · saved on this device</span></h1>
</header>
<div class="warnbar" id="storageWarn">This browser is not saving data (private mode?). Use Backup before closing.</div>
<nav class="tabs" role="tablist">
  <button role="tab" data-tab="dash" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6h-6v6H4a1 1 0 01-1-1z"/></svg><span>Home</span></button>
  <button role="tab" data-tab="menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3v8a3 3 0 003 3v7M7 3v6M10 3v8a3 3 0 01-3 3"/><path d="M17 21V3c-2 1.5-3 4-3 7s1 4 3 4"/></svg><span>Menu Plan</span></button>
  <button role="tab" data-tab="exp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h12v20l-3-2-3 2-3-2-3 2z"/><path d="M9 7h6M9 11h6M9 15h4"/></svg><span>Expenses</span></button>
  <button role="tab" data-tab="reports"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Reports</span></button>
  <button role="tab" data-tab="products"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 7v10l9 4 9-4V7M12 11v10"/></svg><span>Products</span></button>

<div class="toast" id="toast"></div>

<!-- Expense dialog -->
<dialog id="dlgExp">
  <form method="dialog" id="fExp" autocomplete="off">
    <h3 id="dlgExpTitle">Add expense</h3>
    <div class="fgrid">
      <label>Date<input type="date" name="date" required></label>
      <label>Category<select name="category" required></select></label>
      <label class="full">Item / product<input name="name" list="dlProducts" required placeholder="Type to search, e.g. Pork Kasim or Sardines"></label>

      <label class="check full" id="chkNewWrap" hidden><input type="checkbox" name="saveProduct" checked> Save this as a new product in my list</label>

    </div>

      <span class="spacer"></span>
      <button class="btn" type="button" data-close>Cancel</button>
      <button class="btn" type="button" id="btnExpAgain">Save &amp; add another</button>
      <button class="btn primary" type="submit">Save</button>
    </div>
  </form>
</dialog>

<!-- Product dialog -->
<dialog id="dlgProd">
  <form method="dialog" id="fProd" autocomplete="off">
    <h3 id="dlgProdTitle">Add product</h3>
    <div class="fgrid">
      <label class="full">Product name<input name="name" required placeholder="e.g. Sardines in tomato sauce 155 g"></label>
      <label>Category<select name="category" required></select></label>

<script>

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function freshDB(){
  return {
    v:1,
    cats: DEFAULT_CATS.slice(),
    products: SEED.map(p => ({id:uid(), name:p[0], cat:p[1], unit:p[2], price:+p[3], src:p[4]==="est"?"est":"3F"})),
    expenses: [],
    budgets: [],
    ui: {tab:"dash"}
  };
}
function load(){
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch(e){ storageOK = false; }
  if (raw) { try { DB = JSON.parse(raw); } catch(e){ DB = null; } }
  if (!DB || !Array.isArray(DB.products)) DB = freshDB();
  else SEED.forEach(p => { if (!DB.products.some(x => x.name === p[0])) DB.products.push({id:uid(), name:p[0], cat:p[1], unit:p[2], price:+p[3], src:p[4]==="est"?"est":"3F"}); });
  DB.ui = DB.ui || {tab:"dash"};
  DB.cats = DB.cats && DB.cats.length ? DB.cats : DEFAULT_CATS.slice();
  save(true);
}
function save(silent){
  try { localStorage.setItem(KEY, JSON.stringify(DB)); storageOK = true; }
  catch(e){ storageOK = false; }
  document.getElementById("storageWarn").style.display = storageOK ? "none" : "block";
}

/* ============ Helpers ============ */
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseD = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const today = () => iso(new Date());
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate()+n); return iso(d); };
const diffDays = (a, b) => Math.round((parseD(b) - parseD(a)) / 864e5);
function addMonths(s, n){
  const d = parseD(s); const day = d.getDate();
  const t = new Date(d.getFullYear(), d.getMonth()+n, 1);
  const last = new Date(t.getFullYear(), t.getMonth()+1, 0).getDate();
  t.setDate(Math.min(day, last)); return iso(t);
}
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const fmtShort = s => { const d = parseD(s); return `${MON[d.getMonth()]} ${d.getDate()}`; };
const fmtLong = s => { const d = parseD(s); return `${DOW[d.getDay()]}, ${MON[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`; };
const fmtRange = (a, b) => { const A = parseD(a), B = parseD(b);
  return A.getFullYear() === B.getFullYear() ? `${fmtShort(a)} – ${fmtShort(b)}, ${B.getFullYear()}` : `${fmtShort(a)}, ${A.getFullYear()} – ${fmtShort(b)}, ${B.getFullYear()}`; };
const peso = x => "₱" + (Math.round((+x||0)*100)/100).toLocaleString("en-PH",{minimumFractionDigits:2, maximumFractionDigits:2});
const peso0 = x => "₱" + Math.round(+x||0).toLocaleString("en-PH");
const pesoK = x => { x = +x||0; if (Math.abs(x) >= 1000) return "₱" + (x/1000).toFixed(x >= 10000 ? 0 : 1).replace(/\.0$/,"") + "k"; return "₱" + Math.round(x); };
const qtyFmt = q => (Math.round(q*1000)/1000).toLocaleString("en-PH",{maximumFractionDigits:3});
const total = e => (+e.qty||0) * (+e.price||0);
const sum = (arr, f) => arr.reduce((a, x) => a + f(x), 0);
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove("show"), 2200); }
function findProduct(name){ const n = String(name||"").trim().toLowerCase(); return DB.products.find(p => p.name.toLowerCase() === n); }
function download(name, text, type){
  if (window.AndroidBridge){ // inside the Android app: save straight to Downloads
    try { AndroidBridge.saveFile(name, btoa(unescape(encodeURIComponent(text))), type.split(";")[0]); return; } catch(e){}
  }
  const blob = new Blob([text], {type});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
const ICON = {
  good:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M7.5 12.5l3 3 6-6.5"/></svg>',
  warn:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l10 18H2L12 3z"/><path d="M12 10v5M12 18h.01"/></svg>',
  crit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/></svg>',
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  repeat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 013-3h15M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 01-3 3H3"/></svg>'
};
const STATUS_LABEL = {good:"On track", warn:"Watch spending", crit:"Over budget"};
const badge = st => `<span class="badge ${st}">${ICON[st]}${STATUS_LABEL[st]}</span>`;

/* ============ Budget logic ============ */
function computeEnd(type, start, oldStart, oldEnd){
  if (type === "weekly") return addDays(start, 6);
  if (type === "biweekly") return addDays(start, 13);
  if (type === "monthly") return addDays(addMonths(start, 1), -1);
  if (oldStart && oldEnd) return addDays(start, diffDays(oldStart, oldEnd));
  return addDays(start, 13);
}
const TYPE_LABEL = {weekly:"Weekly", biweekly:"Bi-weekly", monthly:"Monthly", custom:"Custom"};
function budgetsSorted(){ return DB.budgets.slice().sort((a,b) => b.start.localeCompare(a.start)); }
function currentBudget(){
  const t = today();
  const inNow = budgetsSorted().filter(b => b.start <= t && t <= b.end);
  if (inNow.length) return inNow[0];
  const past = budgetsSorted().filter(b => b.start <= t);
  return past[0] || budgetsSorted().slice(-1)[0] || null;
}
function budgetName(b){ return (b.label ? b.label + " · " : "") + fmtRange(b.start, b.end); }
function expensesIn(a, b){ return DB.expenses.filter(e => e.date >= a && e.date <= b); }
function budgetStats(b){
  const ex = expensesIn(b.start, b.end);
  const spent = sum(ex, total);
  const days = diffDays(b.start, b.end) + 1;
  const t = today();
  let elapsed = t < b.start ? 0 : t > b.end ? days : diffDays(b.start, t) + 1;
  const daysLeft = t > b.end ? 0 : t < b.start ? days : days - elapsed + 1; // today counts as a day you can still spend
  const pace = b.amount * elapsed / days;
  const remaining = b.amount - spent;
  const pct = b.amount ? spent / b.amount : 0;
  const daily = b.amount / days;
  const avg = elapsed ? spent / elapsed : 0;
  const projected = elapsed ? avg * days : spent;
  const safeDaily = daysLeft ? Math.max(0, remaining) / daysLeft : 0;
  let status = "good";
  if (spent > b.amount) status = "crit";
  else if (pct >= 0.8 || (elapsed && spent > pace * 1.1)) status = "warn";
  return {ex, spent, days, elapsed, daysLeft, pace, remaining, pct, daily, avg, projected, safeDaily, status, done: t > b.end, upcoming: t < b.start};
}

/* ============ Charts (hand-drawn SVG, offline) ============ */
function niceTicks(max, count=4){
  if (max <= 0) return [0, 1];
  const raw = max / count, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1,2,2.5,5,10].map(m => m*mag).find(s => s >= raw);
  const ticks = []; for (let v = 0; v <= max + step*0.001; v += step) ticks.push(v);
  if (ticks[ticks.length-1] < max) ticks.push(ticks[ticks.length-1] + step);
  return ticks;
}
function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

/* Cumulative spending vs budget (line) */
function drawCumulative(el, b, st){
  const W = Math.max(280, el.clientWidth), H = 230, m = {l:48, r:14, t:14, b:26};
  const days = st.days, iw = W-m.l-m.r, ih = H-m.t-m.b;
  const perDay = new Array(days).fill(0);
  st.ex.forEach(e => { const i = diffDays(b.start, e.date); if (i >= 0 && i < days) perDay[i] += total(e); });
  const shown = st.upcoming ? 0 : st.elapsed;
  const cum = []; let run = 0; for (let i = 0; i < shown; i++){ run += perDay[i]; cum.push(run); }
  const ymax = Math.max(b.amount, run) * 1.06;
  const ticks = niceTicks(ymax); const top = ticks[ticks.length-1];
  const x = i => m.l + (days === 1 ? iw/2 : iw * i/(days-1));
  const y = v => m.t + ih - ih * v/top;
  let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Running total of spending compared with the budget">`;
  ticks.forEach(t => { s += `<line x1="${m.l}" x2="${W-m.r}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${m.l-6}" y="${y(t)+4}" text-anchor="end">${pesoK(t)}</text>`; });
  const step = Math.max(1, Math.ceil(days / Math.max(2, Math.floor(iw/56))));
  for (let i = 0; i < days; i += step) s += `<text x="${x(i)}" y="${H-8}" text-anchor="middle">${fmtShort(addDays(b.start,i))}</text>`;
  s += `<line x1="${m.l}" x2="${W-m.r}" y1="${y(0)}" y2="${y(0)}" stroke="var(--axis)"/>`;
  // budget cap
  s += `<line x1="${m.l}" x2="${W-m.r}" y1="${y(b.amount)}" y2="${y(b.amount)}" stroke="var(--crit)" stroke-width="1.5" stroke-dasharray="2 3"/>`;
  s += `<text x="${W-m.r}" y="${y(b.amount)-6}" text-anchor="end" style="fill:var(--ink-2);font-weight:600">Budget ${peso0(b.amount)}</text>`;
  // pace line
  s += `<line x1="${x(0)}" y1="${y(b.amount/days)}" x2="${x(days-1)}" y2="${y(b.amount)}" stroke="var(--pace)" stroke-width="2" stroke-dasharray="6 5"/>`;
  if (cum.length){
    const pts = cum.map((v,i) => `${x(i)},${y(v)}`).join(" ");
    s += `<polyline points="${pts}" fill="none" stroke="var(--series-1)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
    const li = cum.length-1;
    s += `<circle cx="${x(li)}" cy="${y(cum[li])}" r="5" fill="var(--series-1)" stroke="var(--surface)" stroke-width="2"/>`;
  }
  s += `<line class="xh" x1="0" x2="0" y1="${m.t}" y2="${m.t+ih}" stroke="var(--ink-2)" stroke-width="1" opacity="0"/>`;
  s += `<circle class="hd" r="5" fill="var(--series-1)" stroke="var(--surface)" stroke-width="2" opacity="0"/>`;
  s += `<rect class="hit" x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent"/>`;
  s += `</svg><div class="tip"></div>`;
  el.innerHTML = s;
  const svg = el.querySelector("svg"), tip = el.querySelector(".tip"), xh = el.querySelector(".xh"), hd = el.querySelector(".hd");
  const move = ev => {
    const r = svg.getBoundingClientRect(); const px = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left;
    let i = Math.round((px - m.l) / (iw/(Math.max(1,days-1)))); i = Math.max(0, Math.min(days-1, i));
    const d = addDays(b.start, i), exp = b.amount*(i+1)/days;
    xh.setAttribute("x1", x(i)); xh.setAttribute("x2", x(i)); xh.setAttribute("opacity", 1);
    let body = `<b>${fmtLong(d)}</b>`;
    if (i < cum.length){ hd.setAttribute("cx", x(i)); hd.setAttribute("cy", y(cum[i])); hd.setAttribute("opacity", 1);
      body += `Spent this day: ${peso(perDay[i])}<br>Total so far: ${peso(cum[i])}<br>`; }
    else { hd.setAttribute("opacity", 0); body += `Not yet reached<br>`; }
    body += `Expected by this day: ${peso(exp)}`;
    tip.innerHTML = body; tip.style.left = Math.min(Math.max(x(i), 90), W-90) + "px"; tip.style.top = (i < cum.length ? y(cum[i]) : y(exp)) + "px"; tip.style.opacity = 1;
  };
  const leave = () => { tip.style.opacity = 0; xh.setAttribute("opacity", 0); hd.setAttribute("opacity", 0); };
  const hit = el.querySelector(".hit");
  hit.addEventListener("mousemove", move); hit.addEventListener("touchstart", move, {passive:true}); hit.addEventListener("touchmove", move, {passive:true});
  hit.addEventListener("mouseleave", leave); hit.addEventListener("touchend", () => setTimeout(leave, 1500));
}

/* Bars over time with optional reference line (daily or monthly) */
function drawBars(el, items, opts={}){
  // items: [{label, tipLabel, value, over}]
  const W = Math.max(280, el.clientWidth), H = opts.height || 200, m = {l:48, r:10, t:16, b:26};
  const iw = W-m.l-m.r, ih = H-m.t-m.b, n = Math.max(1, items.length);
  const vmax = Math.max(opts.ref || 0, ...items.map(d => d.value), 1) * 1.08;
  const ticks = niceTicks(vmax); const top = ticks[ticks.length-1];
  const y = v => m.t + ih - ih*v/top, slot = iw/n, bw = Math.max(2, Math.min(36, slot - 2));
  let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria||"Spending bars")}">`;
  ticks.forEach(t => { s += `<line x1="${m.l}" x2="${W-m.r}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${m.l-6}" y="${y(t)+4}" text-anchor="end">${pesoK(t)}</text>`; });
  const step = Math.max(1, Math.ceil(n / Math.max(2, Math.floor(iw/52))));
  items.forEach((d, i) => {
    const cx = m.l + slot*i + slot/2, h = Math.max(0, y(0) - y(d.value));
    if (d.value > 0){
      const r = Math.min(4, bw/2, h);
      const x0 = cx - bw/2, y0 = y(d.value);
      s += `<path d="M${x0},${y(0)} V${y0+r} Q${x0},${y0} ${x0+r},${y0} H${x0+bw-r} Q${x0+bw},${y0} ${x0+bw},${y0+r} V${y(0)} Z" fill="${d.over ? "var(--crit)" : "var(--series-1)"}"/>`;
    }
    s += `<rect class="hb" data-i="${i}" x="${m.l+slot*i}" y="${m.t}" width="${slot}" height="${ih}" fill="transparent"/>`;
    if (i % step === 0) s += `<text x="${cx}" y="${H-8}" text-anchor="middle">${esc(d.label)}</text>`;
  });
  s += `<line x1="${m.l}" x2="${W-m.r}" y1="${y(0)}" y2="${y(0)}" stroke="var(--axis)"/>`;
  if (opts.ref){
    s += `<line x1="${m.l}" x2="${W-m.r}" y1="${y(opts.ref)}" y2="${y(opts.ref)}" stroke="var(--ink-2)" stroke-width="1.5" stroke-dasharray="6 4"/>`;
    s += `<text x="${W-m.r}" y="${y(opts.ref)-6}" text-anchor="end" style="fill:var(--ink-2);font-weight:600">${esc(opts.refLabel||"")} ${peso0(opts.ref)}</text>`;
  }
  s += `</svg><div class="tip"></div>`;
  el.innerHTML = s;
  const tip = el.querySelector(".tip");
  el.querySelectorAll(".hb").forEach(r => {
    const show = () => { const i = +r.dataset.i, d = items[i];
      tip.innerHTML = `<b>${esc(d.tipLabel||d.label)}</b>${peso(d.value)}${d.over ? "<br>Above daily budget" : ""}${d.extra ? "<br>"+esc(d.extra) : ""}`;
      tip.style.left = Math.min(Math.max(m.l + slot*i + slot/2, 80), W-80) + "px"; tip.style.top = y(d.value) + "px"; tip.style.opacity = 1; r.setAttribute("fill","rgba(127,127,127,.08)"); };
    const hide = () => { tip.style.opacity = 0; r.setAttribute("fill","transparent"); };
    r.addEventListener("mouseenter", show); r.addEventListener("mouseleave", hide);
    r.addEventListener("touchstart", show, {passive:true}); r.addEventListener("touchend", () => setTimeout(hide, 1500));
  });
}

function categoryRows(ex){
  const by = {}; ex.forEach(e => { by[e.cat] = (by[e.cat]||0) + total(e); });
  const tot = sum(Object.values(by), v => v);
  return Object.entries(by).sort((a,b) => b[1]-a[1]).map(([cat, v]) => ({cat, v, share: tot ? v/tot : 0}));
}
function categoryTable(ex){
  const rows = categoryRows(ex); if (!rows.length) return `<div class="empty">No expenses yet.</div>`;
  const max = rows[0].v;
  return `<div class="tbl-wrap"><table><thead><tr><th>Category</th><th class="hide-sm" style="width:40%"></th><th class="r">Amount</th><th class="r">Share</th></tr></thead><tbody>${
    rows.map(r => `<tr title="${esc(r.cat)}: ${peso(r.v)}"><td>${esc(r.cat)}</td><td class="bar-cell hide-sm"><div class="b" style="width:${Math.max(2, r.v/max*100)}%"></div></td><td class="r">${peso(r.v)}</td><td class="r">${(r.share*100).toFixed(1)}%</td></tr>`).join("")
  }</tbody></table></div>`;
}
function itemRows(ex){
  const by = {};
  ex.forEach(e => { const k = e.name.toLowerCase() + "|" + e.unit;
    const o = by[k] || (by[k] = {name:e.name, cat:e.cat, unit:e.unit, qty:0, amt:0, n:0});
    o.qty += +e.qty||0; o.amt += total(e); o.n++; });
  return Object.values(by).sort((a,b) => b.amt - a.amt);
}
function priceWatch(ex){
  return ex.map(e => { const p = findProduct(e.name); return p && p.unit === e.unit && +e.price > p.price + 0.004 ? {e, p, extra:(e.price - p.price)*e.qty} : null; })
    .filter(Boolean).sort((a,b) => b.extra - a.extra);
}

/* Range filter shared by Expenses and Reports */
function rangeOf(f){
  const t = today(), d = parseD(t);
  switch (f.range){
    case "budget": { const b = DB.budgets.find(x => x.id === f.budget) || currentBudget(); return b ? [b.start, b.end, b] : ["0000-01-01","9999-12-31"]; }
    case "today": return [t, t];
    case "thisweek": { const s = addDays(t, -((d.getDay()+6)%7)); return [s, addDays(s, 6)]; }
    case "thismonth": return [iso(new Date(d.getFullYear(), d.getMonth(), 1)), iso(new Date(d.getFullYear(), d.getMonth()+1, 0))];
    case "lastmonth": return [iso(new Date(d.getFullYear(), d.getMonth()-1, 1)), iso(new Date(d.getFullYear(), d.getMonth(), 0))];
    case "last30": return [addDays(t, -29), t];
    case "custom": return [f.from || "0000-01-01", f.to || "9999-12-31"];
    default: return ["0000-01-01", "9999-12-31"];
  }
}
function rangeSelect(f, key){
  const opts = [["budget","Budget period"],["today","Today"],["thisweek","This week (Mon–Sun)"],["thismonth","This month"],["lastmonth","Last month"],["last30","Last 30 days"],["all","All time"],["custom","Custom dates"]];
  let h = `<label>Date range<select data-f="${key}.range">${opts.map(o => `<option value="${o[0]}" ${f.range===o[0]?"selected":""}>${o[1]}</option>`).join("")}</select></label>`;
  if (f.range === "budget" && DB.budgets.length) h += `<label style="flex:2 1 220px">Budget<select data-f="${key}.budget">${budgetOptions((DB.budgets.find(x=>x.id===f.budget)||currentBudget()).id)}</select></label>`;
  if (f.range === "custom") h += `<label>From<input type="date" data-f="${key}.from" value="${f.from}"></label><label>To<input type="date" data-f="${key}.to" value="${f.to}"></label>`;
  return h;
}
function applyFilters(f){
  const [a, b] = rangeOf(f); const q = f.q.trim().toLowerCase();
  return DB.expenses.filter(e => e.date >= a && e.date <= b && (!f.cat || e.cat === f.cat) && (!q || (e.name + " " + (e.note||"")).toLowerCase().includes(q)));

function openExpense(e, preset){
  editingExp = e || null; fillProductList();
  const f = $("#fExp"); f.reset();
  f.category.innerHTML = catOptions(e ? e.cat : (preset && preset.cat) || "Others");
  $("#dlgExpTitle").textContent = e ? "Edit expense" : "Add expense";
  f.date.value = e ? e.date : (preset && preset.date) || today();
  f.name.value = e ? e.name : (preset && preset.name) || "";
  f.qty.value = e ? e.qty : 1;
  f.unit.value = e ? e.unit : (preset && preset.unit) || "";
  f.price.value = e ? e.price : (preset && preset.price != null ? preset.price : "");
  f.note.value = e ? (e.note || "") : (preset && preset.note) || "";
  $("#btnExpDelete").hidden = !e; $("#btnExpAgain").hidden = !!e;
  expSync(false); $("#dlgExp").showModal();
  if (!e && !(preset && preset.name)) setTimeout(() => f.name.focus(), 50); else if (!e) setTimeout(() => f.qty.select(), 50);
}
function expSync(fromName){
  const f = $("#fExp"); const p = findProduct(f.name.value);
  if (fromName && p){ f.category.value = p.cat; f.unit.value = p.unit; f.price.value = p.price; }
  $("#chkNewWrap").hidden = !!p || !f.name.value.trim();
  const priceDiff = p && f.price.value !== "" && Math.abs(+f.price.value - p.price) > 0.004;
  $("#chkPriceWrap").hidden = !priceDiff;
  if (priceDiff) $("#chkPriceTxt").textContent = `Update "${p.name}" price from ${peso(p.price)} to ${peso(+f.price.value)}`;
  $("#expTotal").textContent = peso((+f.qty.value||0) * (+f.price.value||0));
}
function saveExpense(again){
  const f = $("#fExp"); if (!f.reportValidity()) return false;
  const rec = {date:f.date.value, name:f.name.value.trim(), cat:f.category.value, unit:f.unit.value.trim(), qty:+f.qty.value, price:+f.price.value, note:f.note.value.trim()};
  let p = findProduct(rec.name);
  if (!p && f.saveProduct.checked){ p = {id:uid(), name:rec.name, cat:rec.cat, unit:rec.unit, price:rec.price, src:"mine"}; DB.products.push(p); }
  else if (p && !$("#chkPriceWrap").hidden && f.updatePrice.checked){ p.price = rec.price; }
  if (editingExp) Object.assign(editingExp, rec); else DB.expenses.push(Object.assign({id:uid()}, rec));
  save(); toast(editingExp ? "Expense updated" : `Saved ${peso(rec.qty*rec.price)}`);
  if (again){ const keep = {date: rec.date, note: rec.note}; editingExp = null; openExpense(null, keep); }
  else $("#dlgExp").close();
  render(); return true;
}

function openProduct(p){
  editingProd = p || null; const f = $("#fProd"); f.reset();
  f.category.innerHTML = catOptions(p ? p.cat : (UI.prod.cat || "Canned Goods"));
  $("#dlgProdTitle").textContent = p ? "Edit product" : "Add product";
  if (p){ f.name.value = p.name; f.unit.value = p.unit; f.price.value = p.price; }
  $("#btnProdDelete").hidden = !p; $("#dlgProd").showModal(); if (!p) setTimeout(() => f.name.focus(), 50);
}
function saveProduct(){
  const f = $("#fProd"); if (!f.reportValidity()) return;
  const nc = f.newcat.value.trim();
  if (nc && !DB.cats.includes(nc)) DB.cats.splice(DB.cats.length - 1, 0, nc);
  const rec = {name:f.name.value.trim(), cat: nc || f.category.value, unit:f.unit.value.trim(), price:+f.price.value};
  const dup = findProduct(rec.name);
  if (dup && dup !== editingProd){ alert("A product with this name already exists."); return; }
  if (editingProd) Object.assign(editingProd, rec); else DB.products.push(Object.assign({id:uid(), src:"mine"}, rec));
  save(); $("#dlgProd").close(); toast("Product saved"); render();
}

function openBudget(b, preset){
  editingBud = b || null; const f = $("#fBud"); f.reset();
  const src = b || preset || {type:"weekly", start:today(), amount:""};
  f.type.value = src.type; f.start.value = src.start; f.amount.value = src.amount ?? "";
  f.end.value = src.end || computeEnd(src.type, src.start); f.label.value = src.label || "";
  $("#dlgBudTitle").textContent = b ? "Edit budget" : "Set a budget";
  $("#btnBudDelete").hidden = !b; budSync(); $("#dlgBud").showModal();
}
function budSync(changed){
  const f = $("#fBud");
  if (changed && f.type.value !== "custom" && f.start.value) f.end.value = computeEnd(f.type.value, f.start.value);
  f.end.readOnly = f.type.value !== "custom";
  if (f.start.value && f.end.value && f.end.value >= f.start.value){
    const days = diffDays(f.start.value, f.end.value) + 1, amt = +f.amount.value || 0;
    $("#budInfo").textContent = `${fmtRange(f.start.value, f.end.value)} · ${days} days${amt ? ` · ${peso(amt/days)} per day · ${peso(amt/days*7)} per week` : ""}`;
  } else $("#budInfo").textContent = "End date must be on or after the start date.";
}
function saveBudget(){
  const f = $("#fBud"); if (!f.reportValidity()) return;
  if (f.end.value < f.start.value){ alert("End date must be on or after the start date."); return; }
  const rec = {type:f.type.value, start:f.start.value, end:f.end.value, amount:+f.amount.value, label:f.label.value.trim()};
  const overlap = DB.budgets.find(x => x !== editingBud && x.start <= rec.end && rec.start <= x.end);
  if (editingBud) Object.assign(editingBud, rec); else { const nb = Object.assign({id:uid()}, rec); DB.budgets.push(nb); UI.dashBudget = nb.id; }
  save(); $("#dlgBud").close(); toast(overlap ? "Saved. Note: this overlaps another budget period." : "Budget saved"); render();
}

function exportCSV(rows){
  const q = v => `"${String(v ?? "").replace(/"/g,'""')}"`;

    .concat(rows.slice().sort((a,b) => a.date.localeCompare(b.date)).map(e => [e.date, q(e.name), q(e.cat), e.qty, q(e.unit), (+e.price).toFixed(2), total(e).toFixed(2), q(e.note)].join(",")));
  download(`kitchen-expenses-${today()}.csv`, "﻿" + lines.join("\r\n"), "text/csv");
}

function mulberry(a){ return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const mainProt = d => { const x = d.i.find(i => i[2]); return x ? x[0] : "veg:" + d.n; };
const mainCat = d => { const x = d.i.find(i => i[2]); return x ? pinfo(x[0]).cat : "Vegetables"; };
function menuPeriod(){

  if (b) return {key:b.id, start:b.start, days: diffDays(b.start, b.end) + 1, amount: b.amount, budget:b};

const target = per => per.amount * (1 + (+menuCfg().adj || 0) / 100);
function personsOn(date){ const c = menuCfg(); const o = c.over[date]; return Math.max(1, +(o || c.persons) || 1); }

/* lines for one dish served in a meal slot */
const EGG = "Eggs, medium";
const isEggDish = d => /egg|itlog|torta|omelet|silog|batil/i.test(d.n);
function dishLines(d, slot, persons, lvl, sizes, eggPP){
  const c = menuCfg(), size = (sizes || c.sizes)[slot] || NATIVE[slot];
  const f = SIZE[size] / SIZE[NATIVE[d.m]], egg = eggPP != null ? +eggPP : +c.eggPP;
  // egg dishes: a fixed number of eggs per person (default 1.5), not scaled by meal size or portions
  const lines = d.i.map(([name, q, prot]) => (name === EGG && isEggDish(d))
    ? {name, pp: egg, prot: !!prot, egg:true}
    : {name, pp: q * f * (prot ? lvl : 1), prot: !!prot});
  if (d.r) lines.unshift({name:"Rice, regular milled", pp: RICE_KG[size], rice:true});
  return lines.map(l => { const pi = pinfo(l.name); const qty = l.pp * persons;
    return Object.assign(l, {qty, unit:pi.unit, cat:pi.cat, price:pi.price, cost: qty * pi.price, missing: pi.missing}); });
}
/* evaluate a draft: costs per day + rounded shopping list */
function evalPlan(draft){
  const days = draft.days.map(dd => {
    const persons = dd.locked ? dd.persons : personsOn(dd.date), sizes = dd.locked && dd.sizes ? dd.sizes : menuCfg().sizes;
    const meals = ["B","L","D"].map(m => { const d = RBY[dd.meals[m]] || RECIPES.find(r => r.m === m); const li = mealLvlIdx(dd, m);
      const lines = dishLines(d, m, persons, LEVELS[li].k, sizes, dd.locked && dd.eggPP != null ? dd.eggPP : undefined);
      return {m, dish:d, lvl:li, lines, cost: sum(lines, l => l.cost)}; });
    // dinner = lunch leftovers → the dinner rice is cooked together with lunch
    const Dm = meals[2], Lm = meals[1];
    if (Dm.dish.special === "left"){
      const pi = pinfo("Rice, regular milled"), add = RICE_KG[sizes.D || "light"];
      let rl = Lm.lines.find(l => l.rice);
      if (!rl){ rl = {name:"Rice, regular milled", pp:0, qty:0, rice:true, unit:pi.unit, cat:pi.cat, price:pi.price, cost:0}; Lm.lines.unshift(rl); }
      rl.pp += add; rl.qty += add * persons; rl.cost = rl.qty * rl.price; rl.both = true;
      Lm.cost = sum(Lm.lines, l => l.cost);
    }
    return {date:dd.date, persons, lvl:dd.lvl, sizes, locked: !!dd.locked, meals, cost: sum(meals, x => x.cost)};
  });
  const personDays = sum(days, d => d.persons);
  const agg = {};
  days.forEach(d => d.meals.forEach(ml => ml.lines.forEach(l => { const a = (agg[l.name] = agg[l.name] || {name:l.name, qty:0, locked:0, free:0});
    a.qty += l.qty; if (d.locked) a.locked += l.qty; else a.free += l.qty; })));
  PANTRY.forEach(([name, q]) => { const a = (agg[name] = agg[name] || {name, qty:0, locked:0, free:0}); a.qty += q * personDays / 84; a.pantry = true; });
  // quantities typed in the shopping list: spread the change over the meals of days that are not approved
  const over = draft.shopOver || {};
  Object.values(agg).forEach(a => {
    if (over[a.name] == null) return;
    const want = Math.max(0, +over[a.name]);
    a.auto = a.qty;
    if (!a.pantry){
      const f = a.free > 0 ? Math.max(0, want - a.locked) / a.free : 1;
      a.tooLow = want < a.locked - 1e-9;
      days.forEach(d => { if (d.locked) return; d.meals.forEach(ml => { ml.lines.forEach(l => { if (l.name === a.name){ l.qty *= f; l.pp *= f; l.cost = l.qty * l.price; l.adj = Math.abs(f - 1) > 1e-6; } }); ml.cost = sum(ml.lines, l => l.cost); });
        d.cost = sum(d.meals, x => x.cost); });
    }
    a.set = want;
  });
  const shop = Object.values(agg).map(a => { const pi = pinfo(a.name);
    const auto = pi.unit === "kg" ? Math.ceil((a.auto ?? a.qty) * 20 - 1e-9) / 20 : Math.ceil((a.auto ?? a.qty) - 1e-9);
    const qty = a.set != null ? a.set : auto;
    return {name:a.name, need: a.set != null ? a.set : a.qty, qty, auto, edited: a.set != null, tooLow: !!a.tooLow, unit:pi.unit, cat:pi.cat, price:pi.price, cost: qty * pi.price, missing: pi.missing}; });
  const pantryCost = sum(shop.filter(s => PANTRY.some(p => p[0] === s.name)), s => s.cost);
  days.forEach(d => { d.pantry = pantryCost * d.persons / Math.max(1, personDays); d.total = d.cost + d.pantry; });
  return {days, shop, total: sum(shop, s => s.cost), personDays, missing: shop.some(s => s.missing)};
}
/* auto-fit: biggest portions & most variety that fit the target */
function autoFit(per, prev){
  const c = menuCfg(), tgt = target(per);
  const keep = {}; (prev && prev.days || []).forEach(d => { if (d.locked) keep[d.date] = d; });
  const dates = []; for (let i = 0; i < per.days; i++) dates.push(addDays(per.start, i));
  let best = null;
  for (const [li, frac] of ATTEMPTS){
    const rnd = mulberry(c.seed * 7919 + 13), lvl = LEVELS[li].k, order = {};
    ["B","L","D"].forEach(m => {
      const mv = c.mlvl[m], mk = mv === "auto" ? lvl : LEVELS[+mv].k;
      const costPP = d => sum(dishLines(d, m, 1, mk), l => l.cost);
      const pool = stylePool(m).sort((a,b) => costPP(a) - costPP(b));
      order[m] = shuffled(pool.slice(0, Math.max(4, Math.ceil(pool.length * frac))), rnd);
    });
    // assign dishes: no repeats until the pool is used up, no same meat/fish twice in a day,
    // and lunch's main protein type changes from one day to the next
    const used = {B:new Set(), L:new Set(), D:new Set()}; let prevLunchCat = null;
    Object.values(keep).forEach(k => ["B","L","D"].forEach(m => used[m].add(k.meals[m])));
    const pick = (m, avoid) => {
      const pool = order[m]; if (used[m].size >= pool.length) used[m].clear();
      const free = pool.filter(d => !used[m].has(d.id));
      const ok = free.find(d => avoid(d)) || free[0];
      used[m].add(ok.id); return ok;
    };
    const draft = {status:"draft", edited:false, frac, shopOver: Object.assign({}, prev && prev.shopOver || {}), days: dates.map(date => {
      if (keep[date]){ const k = keep[date]; const kl = RBY[k.meals.L]; prevLunchCat = kl ? mainCat(kl) : prevLunchCat; return JSON.parse(JSON.stringify(k)); }
      const L = pick("L", d => !prevLunchCat || mainCat(d) !== prevLunchCat);
      const B = pick("B", d => mainProt(d) !== mainProt(L));
      const D = c.dinner === "cook" ? pick("D", d => mainProt(d) !== mainProt(L) && mainProt(d) !== mainProt(B)) : SPECIAL_D["X:" + c.dinner];
      prevLunchCat = mainCat(L);
      return {date, lvl:li, meals:{B:B.id, L:L.id, D:D.id}};
    })};
    const ev = evalPlan(draft);
    if (!best || ev.total < best.ev.total) best = {draft, ev};
    if (ev.total <= tgt) return draft;
  }
  return best.draft;
}
function currentDraft(per, force){
  const c = menuCfg(); let p = c.plans[per.key];
  const stale = p && p.status === "draft" && (p.days.length !== per.days || p.days[0].date !== per.start);
  if (!p || stale || (force && p.status === "draft")){ p = autoFit(per, p && p.status === "draft" ? p : null); c.plans[per.key] = p; save(); }
  return p;
}

/* ---------- Actual purchase vs plan ---------- */
const isPantry = n => PANTRY.some(p => p[0] === n);
function actualRows(p){
  p.actual = p.actual || {};
  return p.snap.shop.map((it, i) => {
    const a = p.actual[it.name] || {qty: it.qty, price: it.price};
    const aq = Math.max(0, +a.qty || 0), ap = Math.max(0, +a.price || 0), need = it.need != null ? it.need : it.qty;
    const acost = aq * ap, v = acost - it.cost;
    let st = "same";
    if (aq === 0) st = "none"; else if (aq < need - 1e-6) st = "short"; else if (aq > it.qty + 1e-6) st = "extra";
    const pd = ap - it.price;
    return Object.assign({}, it, {i, aq, ap, need, acost, v, st, pd});
  });
}
function actualCalc(p){
  const rows = actualRows(p), extras = p.extras || [];
  const factor = {}, price = {};
  rows.forEach(r => { factor[r.name] = r.need > 0 ? Math.min(1, r.aq / r.need) : 1; price[r.name] = r.ap; });
  const plannedPantry = sum(rows.filter(r => isPantry(r.name)), r => r.cost), actualPantry = sum(rows.filter(r => isPantry(r.name)), r => r.acost);
  const pr = plannedPantry ? actualPantry / plannedPantry : 1;
  const days = p.snap.days.map(d => {
    const meals = d.meals.map(ml => { const lines = ml.lines.map(l => { const f = factor[l.name] ?? 1, ap = price[l.name] ?? l.price;
        return Object.assign({}, l, {qty: l.qty * f, pp: l.pp * f, cost: l.qty * f * ap, short: f < 0.999}); });
      return Object.assign({}, ml, {lines, cost: sum(lines, l => l.cost)}); });
    const pantry = d.pantry * pr, cost = sum(meals, m => m.cost);
    return Object.assign({}, d, {meals, pantry, total: cost + pantry, short: meals.some(m => m.lines.some(l => l.short))});
  });
  const total = sum(rows, r => r.acost) + sum(extras, x => x.qty * x.price);
  return {rows, extras, days, total, shortRows: rows.filter(r => r.st === "short" || r.st === "none")};
}

function shiftSelect(days, i){

function shiftDays(days, i, kind, j){

  if (kind === "swap"){ const t = content[i]; content[i] = content[j]; content[j] = t; }

}

  if (a === "menuUnapprove"){ const per = menuPeriod(), p = c.plans[per.key]; if (!p) return;
    if (!confirm(p.purchased ? "An actual purchase is already saved for this plan.\n\nCancel the approval anyway and return the menu to draft? The recorded expenses are kept." : "Cancel the approval and return this menu to draft?\n\nOnly do this if the raw products were NOT bought yet.")) return;
    c.plans[per.key] = Object.assign(p.draft, {status:"draft", edited:true}); save(); toast("Back to draft"); render(); }
});
/* ============ Friendlier menu UI: segments, one day at a time, chef card ============ */
let MDAY = null, CHEF_SRC = null;
function segBar(opts){ const cur = opts.some(o => o[0] === DB.ui.mseg) ? DB.ui.mseg : opts[0][0];
  return {cur, html:`<div class="seg no-print">${opts.map(([v, l]) => `<button type="button" data-mseg="${v}" aria-pressed="${cur===v}">${l}</button>`).join("")}</div>`}; }
function pickDay(days){ if (MDAY == null || MDAY >= days.length){ const i = days.findIndex(d => d.date === today()); MDAY = i >= 0 ? i : 0; } return MDAY; }
function dayChips(days, sel, okFn){
  return `<div class="chips no-print">${days.map((d, i) => `<button type="button" class="chip ${okFn && okFn(i) ? "ok" : ""}" data-mdaysel="${i}" aria-pressed="${i===sel}"><b>Day ${i+1}${okFn && okFn(i) ? '<i class="dot"></i>' : ""}</b><span>${DOW[parseD(d.date).getDay()]} ${fmtShort(d.date)}</span></button>`).join("")}</div>`;
}
/* quantities written the way a cook measures */
const FR = [[0,""],[0.25,"¼"],[1/3,"⅓"],[0.5,"½"],[2/3,"⅔"],[0.75,"¾"],[1,""]];
function fracTxt(q){ const w = Math.floor(q + 1e-9), f = q - w; let best = FR[0]; FR.forEach(x => { if (Math.abs(x[0] - f) < Math.abs(best[0] - f)) best = x; });
  const W = w + (best[0] === 1 ? 1 : 0); const s = (W ? String(W) : "") + (best[0] === 1 ? "" : best[1]); return s || "0"; }
const isEggLine = l => /^Eggs/.test(l.name);
function cookName(l){ return l.rice ? (l.both ? "Rice (raw) – for lunch & dinner" : "Rice (raw)") : shortName(l.name); }
function cookQty(l){
  const u = l.unit || "";
  if (u === "kg"){ const txt = l.qty < 1 ? (l.qty*1000 < 50 ? Math.round(l.qty*1000) : Math.round(l.qty*200)*5) + " g" : (Math.round(l.qty*100)/100) + " kg";
    return l.rice ? `${txt} · ${fracTxt(l.qty/0.2)} cups` : txt; }
  if (isEggLine(l)) return Math.ceil(l.qty - 1e-9) + " pcs";
  const pc = /\((\d+) pcs\)/.exec(l.name); if (pc && u === "pack") return Math.round(l.qty * +pc[1]) + " pcs";
  const ft = fracTxt(l.qty), plural = ft !== "1" && !/^[¼⅓½⅔¾]$/.test(ft);
  return `${ft} ${u.includes("(") ? u : (plural ? (u.endsWith("s") ? u : u + "s") : u)}`;
}
function cookPP(l){ if (l.unit === "kg" && (l.prot || l.rice)) return Math.round(l.pp*1000) + " g"; if (isEggLine(l)) return (Math.round(l.pp*10)/10) + " pc"; return ""; }
function mealNote(ml){ return ml.dish.special === "left" ? "Eat the lunch leftovers. Dinner rice is cooked together with lunch." : ml.dish.special === "none" ? "No dinner cooked today." : ""; }

/* ingredient list of one meal (cook view) */
function ingTable(ml, showCost){
  if (!ml.lines.length) return `<div class="small muted" style="padding:4px 0">${esc(mealNote(ml))}</div>`;
  return (mealNote(ml) ? `<div class="small muted">${esc(mealNote(ml))}</div>` : "") + `<table class="ing">${ml.lines.map(l => `<tr><td>${esc(cookName(l))}${l.short ? ' <span class="tag" style="background:var(--warn-bg);color:var(--warn-ink)">short</span>' : ""}${l.adj ? ' <span class="tag" style="background:var(--warn-bg);color:var(--warn-ink)">adjusted</span>' : ""}</td><td class="q">${esc(cookQty(l))}</td><td class="pp">${cookPP(l) ? esc(cookPP(l)) + "/person" : ""}</td>${showCost ? `<td class="pp">${peso(l.cost)}</td>` : ""}</tr>`).join("")}</table>`;
}
const CAM = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h3l2-3h6l2 3h3a1 1 0 011 1v11a1 1 0 01-1 1H4a1 1 0 01-1-1V8a1 1 0 011-1z"/><circle cx="12" cy="13" r="4"/></svg>';

/* days view shared by draft and approved plans */
function daysView(days, opts){
  const sel = pickDay(days), d = days[sel];
  CHEF_SRC = {days, label: opts.label};
  let h = dayChips(days, sel, opts.okFn);
  h += `<div class="card" style="${opts.okFn && opts.okFn(sel) ? "border:2px solid var(--good);" : ""}">` + opts.dayHead(d, sel) +
    `<button class="btn primary bigbtn no-print" data-chef="${sel}" style="margin-top:12px">${CAM}Chef card – photo for the cook</button>` +
    d.meals.map((ml, k) => `<div class="meal-block m-${ml.m}"><div class="meal-head"><span class="meal-pill m-${ml.m}">${MEAL_NAME[ml.m]}</span><span class="small muted" style="font-weight:600">${SIZE_LABEL[(d.sizes || opts.sizes)[ml.m]]}</span><span class="spacer"></span><b class="num small">${peso(ml.cost)}</b></div>
      ${opts.dishCtl(d, sel, ml, k)}${ingTable(ml, false)}</div>`).join("") +
    `<details class="dayedit" style="margin-top:6px"><summary>Show the cost of each ingredient ›</summary>${portionsTable(d)}</details>
    <div class="daynav no-print"><button class="btn" data-mdaysel="${Math.max(0, sel-1)}" ${sel===0?"disabled":""}>‹ Previous day</button><button class="btn" data-mdaysel="${Math.min(days.length-1, sel+1)}" ${sel===days.length-1?"disabled":""}>Next day ›</button></div></div>`;
  h += `<div class="card glance"><h2>All days</h2>${days.map((x, i) => `<div class="list-item" data-mdaysel="${i}" style="${i===sel?"background:var(--brand-soft);":""}"><div class="main"><div class="name">Day ${i+1} · ${fmtLong(x.date)} ${opts.okFn && opts.okFn(i) ? `<span class="tag" style="background:var(--good-bg);color:var(--good-ink)">approved</span>` : ""}</div>
    <div class="meta">${x.meals.map(ml => `<b>${MEAL_NAME[ml.m][0]}</b> ${esc(ml.dish.n)}`).join(" · ")}</div></div><div class="amt num">${peso(x.total)}</div></div>`).join("")}</div>`;
  return h;
}

/* ---------- chef card image ---------- */
function chefModel(d, i, nDays, label){
  const sizes = d.sizes || {};
  return {date: d.date, title: fmtLong(d.date).replace(/, \d{4}$/, ""), sub: `Day ${i+1} of ${nDays} · ${d.persons} ${d.persons===1?"person":"people"}${label ? " · " + label : ""}`,
    meals: d.meals.map(ml => ({meal: MEAL_NAME[ml.m], size: sizes[ml.m] ? SIZE_LABEL[sizes[ml.m]] : "", lvl: ml.lvl != null && !ml.dish.special ? LEVELS[ml.lvl].name : "", dish: dishLabel(ml.dish), note: mealNote(ml),
      lines: ml.lines.map(l => ({name: cookName(l), qty: cookQty(l), pp: cookPP(l)}))}))};
}
function wrapText(ctx, text, maxW){ const words = String(text).split(" "); const out = []; let cur = "";
  words.forEach(w => { const t = cur ? cur + " " + w : w; if (ctx.measureText(t).width > maxW && cur){ out.push(cur); cur = w; } else cur = t; }); if (cur) out.push(cur); return out; }
function drawChef(model, showPP){
  const W = 1080, P = 56, F = '"InterApp", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  const cv = document.createElement("canvas"), ctx = cv.getContext("2d");
  const ops = []; let y = 0;
  const font = (w, s) => `${w} ${s}px ${F}`;
  // layout pass
  y = 250;
  model.meals.forEach(m => {
    ops.push({t:"pill", y, m}); y += 64;
    ctx.font = font(800, 44); const dl = wrapText(ctx, m.dish, W - 2*P); dl.forEach(l => { ops.push({t:"text", y: y + 44, s: l, f: font(800, 44), c:"#111827"}); y += 56; });
    if (m.note){ ctx.font = font(500, 30); wrapText(ctx, m.note, W - 2*P).forEach(l => { ops.push({t:"text", y: y + 34, s: l, f: font(500, 30), c:"#6b6a66"}); y += 42; }); }
    y += 10;
    m.lines.forEach(l => {
      ctx.font = font(500, 34); const nameW = W - 2*P - (showPP ? 430 : 300);
      const nl = wrapText(ctx, l.name, nameW); const rowH = Math.max(1, nl.length) * 44 + 18;
      ops.push({t:"row", y, h: rowH, nl, l}); y += rowH;
    });
    y += 34;
  });
  const H = y + 120;
  cv.width = W; cv.height = H;
  ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, W, H);
  const hg = ctx.createLinearGradient(0, 0, W, 200); hg.addColorStop(0, "#2563eb"); hg.addColorStop(1, "#4f46e5"); ctx.fillStyle = hg; ctx.fillRect(0, 0, W, 200);
  ctx.fillStyle = "#dbe7ff"; ctx.font = font(700, 28); ctx.fillText("MENU FOR THE COOK", P, 62); ctx.fillStyle = "#ffffff";
  ctx.font = font(800, 62); ctx.fillText(model.title, P, 134);
  ctx.font = font(600, 30); ctx.fillStyle = "#dbe7ff"; ctx.fillText(model.sub, P, 180);
  ops.forEach(o => {
    if (o.t === "pill"){ const label = (o.m.meal + (o.m.size ? " · " + o.m.size : "") + "").toUpperCase();
      ctx.font = font(800, 26); const w = ctx.measureText(label).width + 36;
      const MC = {Breakfast:["#fff4e0","#92400e","#d97706"], Lunch:["#e6f6ec","#166534","#16a34a"], Dinner:["#eef0ff","#3730a3","#6366f1"]}[o.m.meal] || ["#eaf1fe","#1e40af","#2563eb"];
      ctx.fillStyle = MC[2]; ctx.fillRect(0, o.y - 6, 10, 58);
      ctx.fillStyle = MC[0]; roundRect(ctx, P, o.y, w, 46, 23); ctx.fill(); ctx.fillStyle = MC[1]; ctx.fillText(label, P + 18, o.y + 32); }
    if (o.t === "text"){ ctx.font = o.f; ctx.fillStyle = o.c; ctx.fillText(o.s, P, o.y); }
    if (o.t === "row"){ ctx.font = font(500, 34); ctx.fillStyle = "#222"; o.nl.forEach((s, k) => ctx.fillText(s, P, o.y + 40 + k*44));
      ctx.textAlign = "right"; ctx.font = font(800, 34); ctx.fillStyle = "#111";
      ctx.fillText(o.l.qty, showPP ? W - P - 190 : W - P, o.y + 40);
      if (showPP && o.l.pp){ ctx.font = font(500, 26); ctx.fillStyle = "#6b6a66"; ctx.fillText(o.l.pp + "/person", W - P, o.y + 40); }
      ctx.textAlign = "left"; ctx.strokeStyle = "#e5e7eb"; ctx.lineWidth = 2; ctx.setLineDash([8, 8]); ctx.beginPath(); ctx.moveTo(P, o.y + o.h - 4); ctx.lineTo(W - P, o.y + o.h - 4); ctx.stroke(); ctx.setLineDash([]); }
  });
  ctx.fillStyle = "#e5e7eb"; ctx.fillRect(P, H - 86, W - 2*P, 2); ctx.font = font(500, 24); ctx.fillStyle = "#6b7280"; ctx.fillText("Weights are raw, before cooking. · Home Kitchen Budget", P, H - 48);
  return cv;
}
function roundRect(ctx, x, y, w, h, r){ ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function chefText(m, showPP){
  return [`MENU FOR THE COOK – ${m.title}`, m.sub, ""].concat(...m.meals.map(x => [`${x.meal.toUpperCase()}${x.size ? " (" + x.size + ")" : ""}: ${x.dish}`].concat(x.note ? ["  " + x.note] : [], x.lines.map(l => `  • ${l.name}: ${l.qty}${showPP && l.pp ? " (" + l.pp + "/person)" : ""}`), [""]))).join("\n");
}
let CHEF = null;
function openChef(i){
  if (!CHEF_SRC) return; const d = CHEF_SRC.days[i]; if (!d) return;
  CHEF = {model: chefModel(d, i, CHEF_SRC.days.length, CHEF_SRC.label)};
  $("#chefPreview").innerHTML = "Preparing…"; $("#dlgChef").showModal();
  (document.fonts && document.fonts.load ? Promise.all([document.fonts.load('800 44px "InterApp"'), document.fonts.load('500 34px "InterApp"')]).catch(() => {}) : Promise.resolve()).then(paintChef);
}
function paintChef(){
  const pp = $("#chefPP").checked; const cv = drawChef(CHEF.model, pp); CHEF.canvas = cv;
  $("#chefPreview").innerHTML = `<img alt="Chef card for ${esc(CHEF.model.title)}" src="${cv.toDataURL("image/png")}">`;
}
function chefFileName(){ return `menu-${CHEF.model.date}.png`; }
$("#chefPP").addEventListener("change", paintChef);
const chefB64 = () => CHEF.canvas.toDataURL("image/png").split(",")[1];
$("#chefSave").addEventListener("click", () => { if (window.AndroidBridge){ AndroidBridge.saveFile(chefFileName(), chefB64(), "image/png"); return; } CHEF.canvas.toBlob(b => { const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = chefFileName(); document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); toast("Photo saved to Downloads"); }, "image/png"); });
$("#chefShare").addEventListener("click", () => {
  if (window.AndroidBridge){ AndroidBridge.shareFile(chefFileName(), chefB64(), "image/png"); return; }
  CHEF.canvas.toBlob(async b => {
    const file = new File([b], chefFileName(), {type:"image/png"});
    try { if (navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:"Menu for the cook"}); return; } } catch(e){ if (e && e.name === "AbortError") return; }
    $("#chefSave").click(); toast("Sharing not available here – photo saved instead");
  }, "image/png");
});
$("#chefCopy").addEventListener("click", async () => { const t = chefText(CHEF.model, $("#chefPP").checked);
  if (window.AndroidBridge){ AndroidBridge.copyText(t); return; }
  try { await navigator.clipboard.writeText(t); toast("Copied – paste it in Messenger or Viber"); } catch(_){ prompt("Copy this text:", t); } });
document.addEventListener("click", e => {
  const c = e.target.closest("[data-chef]"); if (c){ openChef(+c.dataset.chef); return; }
  const s = e.target.closest("[data-mseg]"); if (s){ DB.ui.mseg = s.dataset.mseg; save(); render(); window.scrollTo(0, 0); return; }
  const ds = e.target.closest("[data-mdaysel]"); if (ds && !ds.disabled){ MDAY = +ds.dataset.mdaysel; render(); const card = app.querySelector(".chips"); if (card) card.scrollIntoView({block:"start"}); return; }
});

/* today's menu on the Home dashboard */
function todayMenuCard(){
  const c = DB.menu; if (!c || !c.plans) return "";
  for (const [t, word] of [[today(), "Today's menu"], [addDays(today(), 1), "Tomorrow's menu"]]){
  for (const [key, p] of Object.entries(c.plans)){
    let days = null, label = "";
    if (p.status === "approved"){ if (t < p.snap.start || t > p.snap.end) continue; days = p.purchased ? actualCalc(p).days : p.snap.days; label = "Approved plan"; }
    else if (p.days && p.days.some(d => d.date === t)){ days = evalPlan(p).days; label = "Draft plan"; }
    if (!days) continue;
    const i = days.findIndex(d => d.date === t); if (i < 0) continue;
    const d = days[i]; CHEF_SRC = {days, label};
    return `<div class="card"><div class="row"><h2>${word}</h2><span class="small muted">${label} · Day ${i+1} · ${d.persons} people</span><span class="spacer"></span><button class="btn sm" data-tabgo="menu">Open Menu Plan</button></div>
      ${d.meals.map(ml => `<div class="list-item" style="padding:7px 2px"><span class="meal-pill m-${ml.m}" style="min-width:86px;text-align:center">${MEAL_NAME[ml.m]}</span><div class="main"><div class="name">${esc(dishLabel(ml.dish))}</div></div></div>`).join("")}
      <button class="btn primary bigbtn" data-chef="${i}" style="margin-top:10px">${CAM}Chef card – photo for the cook</button></div>`;
  }
  }
  return "";
}

document.addEventListener("toggle", e => { if (e.target && e.target.matches && e.target.matches("[data-dayedit]")) window.DAYEDIT = e.target.open; }, true);

load(); render();
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
